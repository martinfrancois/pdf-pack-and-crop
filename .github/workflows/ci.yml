name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    name: test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the Python range in README.md.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python pack_and_crop.py --help
      - run: python -m pytest --cov=pack_and_crop --cov-report=term-missing --cov-report=json:coverage.json
      - name: Require measured application coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("coverage.json").read_text())
          assert report["files"]["pack_and_crop.py"]["executed_lines"], 'cannot verify coverage "pack_and_crop.py": expected measured application lines'
          PY
      - name: Run the documented synthetic example
        run: python pack_and_crop.py examples/labels -o packed.pdf
  # The ruleset requires a check named "test", so this job reports the matrix as one result.
  test:
    needs: python
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every Python version to pass
        env:
          RESULT: ${{ needs.python.result }}
        run: test "$RESULT" = success
