name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python pack_and_crop.py --help
      - run: python -m pytest --cov=pack_and_crop --cov-report=term-missing --cov-report=json:coverage.json
      - name: Require measured application coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("coverage.json").read_text())
          assert report["files"]["pack_and_crop.py"]["executed_lines"], 'cannot verify coverage "pack_and_crop.py": expected measured application lines'
          PY
      - name: Run the documented synthetic example
        run: python pack_and_crop.py examples/labels -o packed.pdf
